<svg width="220" height="72" viewBox="0 0 220 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shop logo</title>
  <desc id="desc">A two-tone technology inspired shop logo with a central circuit-tree divider.</desc>
  <defs>
    <linearGradient id="leftSide" x1="4" y1="68" x2="36" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F66C6"/>
      <stop offset="1" stop-color="#7188D4"/>
    </linearGradient>
    <linearGradient id="rightSide" x1="68" y1="68" x2="36" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BAAF2"/>
      <stop offset="1" stop-color="#D8DEFF"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="78" y1="20" x2="190" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7188D4"/>
      <stop offset="1" stop-color="#9BAAF2"/>
    </linearGradient>
    <filter id="glow" x="-20" y="-20" width="112" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="markClip"><rect x="4" y="4" width="64" height="64" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#markClip)">
    <rect x="4" y="4" width="64" height="64" rx="18" fill="#0B1026"/>
    <path d="M4 4H36V68H4V4Z" fill="url(#leftSide)" opacity="0.95"/>
    <path d="M36 4H68V68H36V4Z" fill="url(#rightSide)" opacity="0.95"/>
    <path d="M4 50C16 45 24 45 36 50C48 55 57 55 68 49V68H4V50Z" fill="#071023" opacity="0.42"/>
    <circle cx="36" cy="64" r="26" fill="#071023" opacity="0.28"/>
  </g>
  <g filter="url(#glow)" stroke="#F4F7FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 56V20"/>
    <path d="M36 42L22 30"/>
    <path d="M36 35L51 23"/>
    <path d="M36 49L54 40"/>
    <path d="M36 30L25 20"/>
  </g>
  <g fill="#F4F7FF" filter="url(#glow)">
    <circle cx="36" cy="20" r="4.8"/>
    <circle cx="22" cy="30" r="4.8"/>
    <circle cx="51" cy="23" r="4.8"/>
    <circle cx="54" cy="40" r="4.8"/>
    <circle cx="25" cy="20" r="4.8"/>
    <circle cx="36" cy="56" r="4.2"/>
  </g>
  <text x="82" y="32" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.04em">Shop</text>
  <text x="82" y="54" fill="url(#wordGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.04em">Name</text>
  <path d="M154 21V56" stroke="#CBD5FF" stroke-width="2" stroke-linecap="round"/>
  <text x="166" y="43" fill="#7188D4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="0.16em">STORE</text>
