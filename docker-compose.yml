
services:
  # === DB config ===
  db:
    image: postgres:16-alpine
    container_name: growcore_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - pgdata_local:/var/lib/postgresql/data


  # === Backend config ===
  backend:
    build: ./backend
    container_name: growcore_backend
    restart: always

    # .env file
    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      FRONTEND_URL: http://localhost:5173
      ADDITIONAL_CORS_ORIGINS: http://127.0.0.1:5173
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAMESITE: lax
      # Local development is same-origin through the Vite proxy. Keeping CSRF
      # disabled here also prevents stale pre-CSRF browser sessions from
      # producing repeated 401 responses after a backend update.
      JWT_COOKIE_CSRF_PROTECT: "false"

    ports:
      - "8000:8000"

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20

    volumes:
      - ./backend:/app              # Hot Reload
      - ./backend/storage:/storage  # The files are located in backend/storage

  
  # === Frontend config ===
  frontend:
    build: ./frontend
    container_name: growcore_frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173

    # .env file
    env_file:
      - ./frontend/.env
    
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: /api

    ports:
      - "5173:5173"

    expose:
      - "5173"

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./frontend:/app   # React components synchronization
      - /app/node_modules


volumes:
  pgdata_local:
